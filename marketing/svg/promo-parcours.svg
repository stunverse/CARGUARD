<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF2A2A"/><stop offset="1" stop-color="#E50914"/>
    </linearGradient>
    <style>
      g, text, rect, circle, path { transform-box: fill-box; transform-origin: center; }
      .t{fill:#fff} .muted{fill:#9AA3AF}
      @keyframes title {0%{opacity:0;transform:translateY(-24px)} 6%{opacity:1;transform:translateY(0)} 100%{opacity:1}}
      @keyframes step  {0%{opacity:.15} 100%{opacity:1}}
      @keyframes tick  {0%{stroke-dashoffset:60} 100%{stroke-dashoffset:0}}
      @keyframes cta   {0%,82%{opacity:0;transform:scale(.9)} 90%{opacity:1;transform:scale(1)} 100%{opacity:1}}
      .title{animation:title 9s ease-in-out infinite}
      .s1{animation:step 9s ease-in-out infinite}    .s1 .ck{animation:tick 9s ease-in-out infinite}
      .s2{animation:step 9s ease-in-out infinite 1.4s} .s2 .ck{animation:tick 9s ease-in-out infinite 1.4s}
      .s3{animation:step 9s ease-in-out infinite 2.8s} .s3 .ck{animation:tick 9s ease-in-out infinite 2.8s}
      .s4{animation:step 9s ease-in-out infinite 4.2s} .s4 .ck{animation:tick 9s ease-in-out infinite 4.2s}
      .cta{animation:cta 9s ease-in-out infinite}
    </style>
  </defs>

  <rect width="1080" height="1920" fill="#0B0B12"/>

  <text class="t title" x="540" y="240" font-size="74" font-weight="800" text-anchor="middle">Pas besoin d'être mécano</text>
  <text class="muted title" x="540" y="320" font-size="42" font-weight="600" text-anchor="middle">Tu suis le guide. L'IA analyse.</text>

  <!-- Steps -->
  <g transform="translate(150,520)">
    <g class="s1">
      <rect x="0" y="0" width="780" height="180" rx="28" fill="#15151d" stroke="#23232c" stroke-width="3"/>
      <circle cx="100" cy="90" r="54" fill="url(#red)"/>
      <text x="100" y="112" font-size="60" text-anchor="middle">📸</text>
      <text class="t" x="200" y="78" font-size="46" font-weight="800">8 photos guidées</text>
      <text class="muted" x="200" y="128" font-size="34">Carrosserie · repeinture · chocs</text>
      <path class="ck" d="M690,90 l24,26 l44,-52" fill="none" stroke="#16A34A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="60" stroke-dashoffset="60"/>
    </g>
    <g class="s2" transform="translate(0,230)">
      <rect x="0" y="0" width="780" height="180" rx="28" fill="#15151d" stroke="#23232c" stroke-width="3"/>
      <circle cx="100" cy="90" r="54" fill="url(#red)"/>
      <text x="100" y="112" font-size="60" text-anchor="middle">🎥</text>
      <text class="t" x="200" y="78" font-size="46" font-weight="800">Vidéos moteur</text>
      <text class="muted" x="200" y="128" font-size="34">Fumée · accélération · fuites</text>
      <path class="ck" d="M690,90 l24,26 l44,-52" fill="none" stroke="#16A34A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="60" stroke-dashoffset="60"/>
    </g>
    <g class="s3" transform="translate(0,460)">
      <rect x="0" y="0" width="780" height="180" rx="28" fill="#15151d" stroke="#23232c" stroke-width="3"/>
      <circle cx="100" cy="90" r="54" fill="url(#red)"/>
      <text x="100" y="112" font-size="60" text-anchor="middle">🎙️</text>
      <text class="t" x="200" y="78" font-size="46" font-weight="800">Son moteur</text>
      <text class="muted" x="200" y="128" font-size="34">Claquement · turbo · ralenti</text>
      <path class="ck" d="M690,90 l24,26 l44,-52" fill="none" stroke="#16A34A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="60" stroke-dashoffset="60"/>
    </g>
    <g class="s4" transform="translate(0,690)">
      <rect x="0" y="0" width="780" height="180" rx="28" fill="#15151d" stroke="#23232c" stroke-width="3"/>
      <circle cx="100" cy="90" r="54" fill="url(#red)"/>
      <text x="100" y="112" font-size="60" text-anchor="middle">🤖</text>
      <text class="t" x="200" y="78" font-size="46" font-weight="800">Rapport IA</text>
      <text class="muted" x="200" y="128" font-size="34">Score · négo · questions vendeur</text>
      <path class="ck" d="M690,90 l24,26 l44,-52" fill="none" stroke="#16A34A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="60" stroke-dashoffset="60"/>
    </g>
  </g>

  <!-- CTA -->
  <g class="cta" transform="translate(540,1700)">
    <rect x="-340" y="-60" width="680" height="120" rx="60" fill="url(#red)"/>
    <text class="t" x="0" y="18" font-size="52" font-weight="800" text-anchor="middle">Ton rapport en quelques min</text>
  </g>
  <text class="muted cta" x="540" y="1820" font-size="38" font-weight="700" text-anchor="middle">CarGuard AI</text>
</svg>
